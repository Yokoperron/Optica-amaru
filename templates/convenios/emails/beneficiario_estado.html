<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:24px;background:#eef3fb;font-family:Arial,Helvetica,sans-serif;color:#0f1b33;">
  <div style="max-width:600px;margin:0 auto;background:#ffffff;border:1px solid #dfe7f2;border-radius:14px;overflow:hidden;">
    <div style="background:#0b6ba8;color:#ffffff;padding:20px 24px;">
      <p style="margin:0;font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.9;">Óptica Amaru · Convenios Digitales</p>
      <h1 style="margin:6px 0 0;font-size:20px;">{{ titulo }}</h1>
    </div>
    <div style="padding:24px;">
      <p style="margin-top:0;">Hola <strong>{{ solicitud.cliente.nombre }}</strong>,</p>
      <p style="color:#475569;line-height:1.5;">{{ mensaje }}</p>
      <div style="background:#f8fafd;border:1px solid #dfe7f2;border-radius:10px;padding:16px;margin:18px 0;">
        <p style="margin:0 0 8px;font-size:15px;"><strong>Código de seguimiento:</strong> <span style="display:inline-block;background:#0f1b33;color:#ffffff;padding:3px 10px;border-radius:6px;letter-spacing:1px;">{{ solicitud.codigo }}</span></p>
        <p style="margin:0 0 6px;"><strong>Convenio:</strong> {{ solicitud.convenio.nombre }}</p>
        <p style="margin:0;"><strong>Estado:</strong> {{ solicitud.get_estado_display }}</p>
      </div>
      {% if url_portal %}
      <p style="text-align:center;margin:20px 0 0;">
        <a href="{{ url_portal }}" style="display:inline-block;background:#0b6ba8;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 22px;border-radius:10px;">
          Ver mi solicitud →
        </a>
      </p>
      {% endif %}
    </div>
  </div>
</body>
</html>
